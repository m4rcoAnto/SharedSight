# Fallback only: if SharedSight.xcodeproj does not open, run `brew install xcodegen && xcodegen` in this folder.
name: SharedSight
options:
  bundleIdPrefix: com.fieldvision
  deploymentTarget: { iOS: "17.0" }
packages:
  SharedSightCore: { path: SharedSightCore }
targets:
  SharedSight:
    type: application
    platform: iOS
    sources: [SharedSightApp]
    dependencies: [{ package: SharedSightCore }]
    info:
      path: Config/Info.generated.plist
      properties:
        CFBundleDisplayName: Shared Sight
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Shared Sight uses the rear camera to detect obstacles and describe them with speech. Video is analysed on the device and never leaves it.
        NSLocalNetworkUsageDescription: Shared Sight uses the local network to exchange obstacle observations with another device you chose to collaborate with.
        NSBonjourServices: [_sharedsight._tcp, _sharedsight._udp]
    settings:
      base: { SWIFT_VERSION: "5.0", TARGETED_DEVICE_FAMILY: "1", PRODUCT_BUNDLE_IDENTIFIER: com.fieldvision.sharedsight }
